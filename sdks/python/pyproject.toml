[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "py-envguard"
version = "0.1.0"
description = "Runtime environment variable validation against envguard.yaml schemas"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["pyyaml>=6.0"]
keywords = ["env", "environment", "validation", "dotenv", "config"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/RINKESH2497/envguard"
Repository = "https://github.com/RINKESH2497/envguard"
