name: "envguard"
description: "Validate environment variables against your envguard.yaml schema"
author: "envguard contributors"

branding:
  icon: "shield"
  color: "green"

inputs:
  schema-path:
    description: "Path to envguard.yaml"
    default: "envguard.yaml"
  env-path:
    description: "Path to .env file"
    default: ".env"
  strict:
    description: "Treat warnings as errors"
    default: "false"
  command:
    description: "Command to run (check, sync, scan)"
    default: "check"
  version:
    description: "envguard version to install"
    default: "latest"

runs:
  using: "composite"
  steps:
    - name: Install envguard
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        if [ "$VERSION" = "latest" ]; then
          go install github.com/RINKESH2497/envguard/cmd/envguard@latest
        else
          go install github.com/RINKESH2497/envguard/cmd/envguard@v${VERSION}
        fi

    - name: Run envguard
      shell: bash
      run: |
        CMD="${{ inputs.command }}"
        case "$CMD" in
          check)
            ARGS="check --config ${{ inputs.schema-path }} --env ${{ inputs.env-path }}"
            if [ "${{ inputs.strict }}" = "true" ]; then
              ARGS="$ARGS --strict"
            fi
            ;;
          sync)
            ARGS="sync --config ${{ inputs.schema-path }}"
            ;;
          scan)
            ARGS="scan"
            ;;
          *)
            echo "Error: unsupported command '$CMD'. Must be check, sync, or scan." >&2
            exit 1
            ;;
        esac
        envguard $ARGS
